name: Control Gate 2 entitlement shadow

# ENABLE starts one isolated read-only sidecar from the exact deployed image.
# DISABLE only removes its lease/container.  Neither action restarts the bot,
# edits dotenv, touches DB/Panel, nor accepts arbitrary commands or values.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Allowlisted runtime transition'
        required: true
        type: choice
        options:
          - DISABLE_SHADOW
          - ENABLE_SHADOW
      expected_deployed_sha:
        description: 'Required for ENABLE: exact 40-char production deploy-state SHA'
        required: false
        type: string
      owner_go_no_go:
        description: 'Exact phrase: OWNER_APPROVED'
        required: true
        type: string
      release_card_reference:
        description: 'Approved Gate 2 observation/stop record (safe characters only)'
        required: true
        type: string

concurrency:
  group: teplo-bot-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enable_verify:
    if: inputs.action == 'ENABLE_SHADOW'
    uses: ./.github/workflows/lint.yml

  enable:
    if: inputs.action == 'ENABLE_SHADOW'
    needs: [enable_verify]
    runs-on: ubuntu-latest
    environment: teplo-vpn-production-controlled-change
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate exact current-main enable request
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          OWNER_GO_NO_GO: ${{ inputs.owner_go_no_go }}
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
          TARGET_REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          test "$TARGET_REF" = 'refs/heads/main'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ACTOR" =~ ^[A-Za-z0-9-]{1,39}$ ]]
          [[ "$RELEASE_CARD_REFERENCE" =~ ^[A-Za-z0-9._:/@-]{1,160}$ ]]
          test "$OWNER_GO_NO_GO" = 'OWNER_APPROVED'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

      - name: Transfer only reviewed enable primitives
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: >-
            .github/scripts/control-entitlement-shadow.sh,
            .github/scripts/verify-entitlement-shadow-baseline.py,
            .github/scripts/run-entitlement-shadow-sidecar.py,
            .github/scripts/watchdog-entitlement-shadow-bootstrap.sh
          target: /var/lib/teplo-vpn/deploy-state/entitlement-shadow-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 2

      - name: Start only the isolated read-only sidecar
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          REQUEST_ACTOR: ${{ github.actor }}
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
          CONTROL_SHA256: ${{ hashFiles('.github/scripts/control-entitlement-shadow.sh') }}
          BASELINE_SHA256: ${{ hashFiles('.github/scripts/verify-entitlement-shadow-baseline.py') }}
          SIDECAR_SHA256: ${{ hashFiles('.github/scripts/run-entitlement-shadow-sidecar.py') }}
          WATCHDOG_SHA256: ${{ hashFiles('.github/scripts/watchdog-entitlement-shadow-bootstrap.sh') }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: TARGET_SHA,WORKFLOW_RUN_ID,WORKFLOW_RUN_ATTEMPT,EXPECTED_DEPLOYED_SHA,REQUEST_ACTOR,RELEASE_CARD_REFERENCE,CONTROL_SHA256,BASELINE_SHA256,SIDECAR_SHA256,WATCHDOG_SHA256
          script: |
            set -Eeuo pipefail
            readonly REPO_DIR='/opt/remnawave-bedolaga-telegram-bot'
            readonly STATE_DIR='/var/lib/teplo-vpn/deploy-state'
            readonly TRANSFER_DIR="$STATE_DIR/entitlement-shadow-transfer-${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
            cleanup() {
              rm -f -- \
                "$TRANSFER_DIR/control-entitlement-shadow.sh" \
                "$TRANSFER_DIR/verify-entitlement-shadow-baseline.py" \
                "$TRANSFER_DIR/run-entitlement-shadow-sidecar.py" \
                "$TRANSFER_DIR/watchdog-entitlement-shadow-bootstrap.sh"
              rmdir -- "$TRANSFER_DIR" 2>/dev/null || true
            }
            trap cleanup EXIT
            test "$(sha256sum "$TRANSFER_DIR/control-entitlement-shadow.sh" | awk '{ print $1 }')" = "$CONTROL_SHA256"
            test "$(sha256sum "$TRANSFER_DIR/verify-entitlement-shadow-baseline.py" | awk '{ print $1 }')" = "$BASELINE_SHA256"
            test "$(sha256sum "$TRANSFER_DIR/run-entitlement-shadow-sidecar.py" | awk '{ print $1 }')" = "$SIDECAR_SHA256"
            test "$(sha256sum "$TRANSFER_DIR/watchdog-entitlement-shadow-bootstrap.sh" | awk '{ print $1 }')" = "$WATCHDOG_SHA256"
            chmod 700 "$TRANSFER_DIR"/*.sh "$TRANSFER_DIR"/*.py
            "$TRANSFER_DIR/control-entitlement-shadow.sh" \
              ENABLE_SHADOW "$TARGET_SHA" "$WORKFLOW_RUN_ID" "$WORKFLOW_RUN_ATTEMPT" \
              "$EXPECTED_DEPLOYED_SHA" "$REQUEST_ACTOR" "$RELEASE_CARD_REFERENCE" \
              "$REPO_DIR" "$STATE_DIR" \
              "$TRANSFER_DIR/verify-entitlement-shadow-baseline.py" \
              "$TRANSFER_DIR/run-entitlement-shadow-sidecar.py" \
              "$TRANSFER_DIR/watchdog-entitlement-shadow-bootstrap.sh"

  disable:
    if: inputs.action == 'DISABLE_SHADOW'
    runs-on: ubuntu-latest
    environment: teplo-vpn-production-controlled-change
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate exact current-main emergency disable request
        env:
          OWNER_GO_NO_GO: ${{ inputs.owner_go_no_go }}
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
          TARGET_REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          test "$TARGET_REF" = 'refs/heads/main'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ACTOR" =~ ^[A-Za-z0-9-]{1,39}$ ]]
          [[ "$RELEASE_CARD_REFERENCE" =~ ^[A-Za-z0-9._:/@-]{1,160}$ ]]
          test "$OWNER_GO_NO_GO" = 'OWNER_APPROVED'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

      - name: Transfer only the reviewed emergency disable primitive
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .github/scripts/disable-entitlement-shadow.sh
          target: /var/lib/teplo-vpn/deploy-state/entitlement-shadow-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 2

      - name: Remove the shadow lease and sidecar only
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_ACTOR: ${{ github.actor }}
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
          DISABLE_SHA256: ${{ hashFiles('.github/scripts/disable-entitlement-shadow.sh') }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          envs: TARGET_SHA,WORKFLOW_RUN_ID,WORKFLOW_RUN_ATTEMPT,REQUEST_ACTOR,RELEASE_CARD_REFERENCE,DISABLE_SHA256
          script: |
            set -Eeuo pipefail
            readonly STATE_DIR='/var/lib/teplo-vpn/deploy-state'
            readonly RUNTIME_DIR='/var/lib/teplo-vpn/entitlement-shadow-runtime'
            readonly TRANSFER_DIR="$STATE_DIR/entitlement-shadow-transfer-${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
            cleanup() {
              rm -f -- "$TRANSFER_DIR/disable-entitlement-shadow.sh"
              rmdir -- "$TRANSFER_DIR" 2>/dev/null || true
            }
            trap cleanup EXIT
            test "$(sha256sum "$TRANSFER_DIR/disable-entitlement-shadow.sh" | awk '{ print $1 }')" = "$DISABLE_SHA256"
            chmod 700 "$TRANSFER_DIR/disable-entitlement-shadow.sh"
            "$TRANSFER_DIR/disable-entitlement-shadow.sh" \
              "$TARGET_SHA" "$WORKFLOW_RUN_ID" "$WORKFLOW_RUN_ATTEMPT" \
              "$REQUEST_ACTOR" "$RELEASE_CARD_REFERENCE" "$STATE_DIR" "$RUNTIME_DIR"
