name: Entitlement shadow one-shot candidate CI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - .github/workflows/entitlement-shadow-one-shot.yml
      - .github/workflows/entitlement-shadow-one-shot-ci.yml
      - .github/scripts/entitlement-shadow-one-shot-control.sh
      - .github/scripts/entitlement_shadow_one_shot.py
      - .github/scripts/entitlement_shadow_readonly_probe.py
      - .github/scripts/entitlement_shadow_create_schema.py
      - .github/scripts/test-entitlement-shadow-one-shot-e2e.sh
      - tests/workflows/test_entitlement_shadow_one_shot.py
      - docs/entitlement_authority/gate2-2-one-shot-revalidation-release-card.md
      - docs/entitlement_authority/gate2-shadow-one-shot-prerequisite-design.md
      - docs/entitlement_authority/gate2-shadow-one-shot-prerequisite-release-card.md
  push:
    branches:
      - main
      - codex/gate2-2-one-shot-revalidation-20260815
    paths:
      - .github/workflows/deploy.yml
      - .github/workflows/entitlement-shadow-one-shot.yml
      - .github/workflows/entitlement-shadow-one-shot-ci.yml
      - .github/scripts/entitlement-shadow-one-shot-control.sh
      - .github/scripts/test-entitlement-shadow-one-shot-e2e.sh
      - tests/workflows/test_entitlement_shadow_one_shot.py
      - docs/entitlement_authority/gate2-2-one-shot-revalidation-release-card.md

concurrency:
  group: teplo-bot-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GATE22_BASE_SHA: 39a0a0dcc5467f6cfe802629213dc3a57273ea25

jobs:
  verify:
    uses: ./.github/workflows/lint.yml

  candidate-boundary:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify public candidate boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "${GATE22_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$GATE22_BASE_SHA" "$CANDIDATE_SHA"
          test ! -e teplo-gate2-2-current-39a0a0dc.tar.gz
          mapfile -t changed < <(git diff --name-only "$GATE22_BASE_SHA" "$CANDIDATE_SHA")
          mapfile -t expected < <(printf '%s\n' \
            '.github/scripts/entitlement-shadow-one-shot-control.sh' \
            '.github/scripts/test-entitlement-shadow-one-shot-e2e.sh' \
            '.github/workflows/deploy.yml' \
            '.github/workflows/entitlement-shadow-one-shot-ci.yml' \
            '.github/workflows/entitlement-shadow-one-shot.yml' \
            'docs/entitlement_authority/gate2-2-one-shot-revalidation-release-card.md' \
            'tests/workflows/test_entitlement_shadow_one_shot.py')
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          git diff --quiet "$GATE22_BASE_SHA" "$CANDIDATE_SHA" -- app
          git diff --quiet "$GATE22_BASE_SHA" "$CANDIDATE_SHA" -- \
            migrations alembic.ini app/database main.py app/config.py Dockerfile .dockerignore docker-compose.yml
          printf 'candidate_sha=%s base_sha=%s runtime_diff=none private_candidate_runtime_e2e=required\n' \
            "$CANDIDATE_SHA" "$GATE22_BASE_SHA"
