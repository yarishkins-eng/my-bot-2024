name: Recover bot code after forward-only migration

# This is an immediate-only, protected recovery path. It uses the durable
# migration journal plus live schema/source/image evidence and remains
# idempotent across interruption at every recovery step.
on:
  workflow_dispatch:
    inputs:
      rollback_source_sha:
        description: 'Exact previous source SHA recorded by the migration release'
        required: true
        type: string
      recovery_rehearsal_evidence:
        description: 'Exact phrase: RECOVERY_PATH_REHEARSED'
        required: true
        type: string
      owner_go_no_go:
        description: 'Exact phrase: OWNER_APPROVED'
        required: true
        type: string
      release_card_reference:
        description: 'Private release-card / incident record reference (no secrets)'
        required: true
        type: string

concurrency:
  group: teplo-bot-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/lint.yml

  recover:
    needs: verify
    runs-on: ubuntu-latest
    environment: teplo-vpn-production-migration
    timeout-minutes: 20
    steps:
      - name: Validate recovery gates
        env:
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
          RECOVERY_REHEARSAL_EVIDENCE: ${{ inputs.recovery_rehearsal_evidence }}
          OWNER_GO_NO_GO: ${{ inputs.owner_go_no_go }}
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
        run: |
          set -Eeuo pipefail
          [[ "$ROLLBACK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RECOVERY_REHEARSAL_EVIDENCE" = 'RECOVERY_PATH_REHEARSED'
          test "$OWNER_GO_NO_GO" = 'OWNER_APPROVED'
          test -n "$RELEASE_CARD_REFERENCE"

      - name: Recover only the captured pre-migration bot image
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
          REQUESTED_ROLLBACK_SHA: ${{ inputs.rollback_source_sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: TARGET_SHA,REQUESTED_ROLLBACK_SHA,GH_TOKEN
          script: |
            set -Eeuo pipefail

            readonly REPO_DIR='/opt/remnawave-bedolaga-telegram-bot'
            readonly SERVICE='bot'
            readonly TARGET_SHA="${TARGET_SHA:?missing workflow target SHA}"
            readonly REQUESTED_ROLLBACK_SHA="${REQUESTED_ROLLBACK_SHA:?missing rollback SHA}"
            readonly MIN_FREE_KB=2097152
            readonly STATE_DIR='/var/lib/teplo-vpn/deploy-state'
            readonly STATE_FILE="$STATE_DIR/bot-production.state"
            readonly RECOVERY_STATE_FILE="$STATE_DIR/bot-production.migration-recovery.state"
            readonly RECOVERY_AUDIT_FILE="$STATE_DIR/bot-production.migration-recovery.${TARGET_SHA}.audit"
            RECOVERY_DIR=''
            RECOVERY_OVERRIDE=''
            CURRENT_SOURCE_SHA=''
            CURRENT_IMAGE_ID=''
            CURRENT_SERVICE_IMAGE=''
            CURRENT_SCHEMA_REVISIONS=''
            RECOVERY_SWITCH_ATTEMPTED=0
            RECOVERY_OLD_IMAGE_VERIFIED=0

            cd "$REPO_DIR"

            compose() {
              if [ -n "$RECOVERY_OVERRIDE" ]; then
                docker compose -f docker-compose.yml -f "$RECOVERY_OVERRIDE" "$@"
              else
                docker compose -f docker-compose.yml "$@"
              fi
            }

            state_value() {
              key="$1"
              file="$2"
              count="$(grep -Ec "^${key}=[^[:space:]]+$" "$file" || true)"
              if [ "$count" != '1' ]; then
                echo "Refusing recovery: missing or duplicate state key ${key}." >&2
                return 1
              fi
              sed -n "s/^${key}=//p" "$file"
            }

            read_schema_revisions() {
              docker compose -f docker-compose.yml exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT version_num FROM alembic_version ORDER BY version_num"' | sort | paste -sd, -
            }

            cleanup_recovery_context() {
              if [ -n "$RECOVERY_DIR" ]; then
                rm -rf "$RECOVERY_DIR"
              fi
            }

            handle_recovery_failure() {
              original_rc=$?
              trap - ERR
              set +e
              if [ "$RECOVERY_OLD_IMAGE_VERIFIED" = '1' ]; then
                echo 'Recovery was interrupted after the compatible old image became healthy; leaving the safe partial state for an idempotent retry.' >&2
                cleanup_recovery_context
                exit "$original_rc"
              fi
              restored=1
              if [ "$RECOVERY_SWITCH_ATTEMPTED" = '1' ] && [ -n "$CURRENT_IMAGE_ID" ]; then
                echo 'Recovery switch failed; restoring the captured current bot image.' >&2
                docker image tag "$CURRENT_IMAGE_ID" "$CURRENT_SERVICE_IMAGE" || restored=0
                # A retry can begin while the captured current image is
                # already the rollback image. Preserve SKIP_MIGRATION in that
                # case; only the migration image may be restored without the
                # recovery override.
                if [ "$CURRENT_IMAGE_ID" != "$RECOVERY_IMAGE_ID" ]; then
                  RECOVERY_OVERRIDE=''
                fi
                compose up -d --no-build --wait --wait-timeout 240 "$SERVICE" || restored=0
                test "$(docker inspect --format '{{.Image}}' remnawave_bot 2>/dev/null)" = "$CURRENT_IMAGE_ID" || restored=0
                test "$(docker inspect --format '{{.State.Health.Status}}' remnawave_bot 2>/dev/null)" = 'healthy' || restored=0
                restored_started_at="$(docker inspect --format '{{.State.StartedAt}}' remnawave_bot 2>/dev/null)" || restored=0
                docker logs --since "$restored_started_at" remnawave_bot 2>&1 | grep -F 'Aiogram polling запущен' >/dev/null || restored=0
                if [ "$CURRENT_IMAGE_ID" = "$RECOVERY_IMAGE_ID" ]; then
                  docker logs --since "$restored_started_at" remnawave_bot 2>&1 | grep -F 'SKIP_MIGRATION=true' >/dev/null || restored=0
                fi
                test "$(read_schema_revisions)" = "$CURRENT_SCHEMA_REVISIONS" || restored=0
              fi
              git checkout --detach "$CURRENT_SOURCE_SHA" || restored=0
              test "$(git rev-parse HEAD 2>/dev/null)" = "$CURRENT_SOURCE_SHA" || restored=0
              cleanup_recovery_context
              if [ "$restored" != '1' ]; then
                echo 'CRITICAL: recovery failed and the previous service could not be proven restored.' >&2
                exit 91
              fi
              echo 'Recovery failed before completion; the previous service image was restored and verified.' >&2
              exit "$original_rc"
            }

            write_recovery_state() {
              state_tmp="$(mktemp "$STATE_DIR/bot-production.XXXXXX")"
              printf 'sha=%s\nimage=%s\nmode=recovery\nschema_revisions=%s\nrecovery_from_sha=%s\n' \
                "$REQUESTED_ROLLBACK_SHA" "$RECOVERY_IMAGE_ID" "$CURRENT_SCHEMA_REVISIONS" "$TARGET_SHA" > "$state_tmp"
              chmod 600 "$state_tmp"
              mv "$state_tmp" "$STATE_FILE"
            }

            ensure_recovery_audit() {
              if [ -e "$RECOVERY_AUDIT_FILE" ]; then
                test -r "$RECOVERY_AUDIT_FILE"
                if grep -Ev '^(recovered_at|source_sha|image|schema_revisions|from_migration_sha)=[^[:space:]]+$' "$RECOVERY_AUDIT_FILE" >/dev/null; then
                  echo 'Refusing recovery: malformed recovery audit.' >&2
                  return 1
                fi
                test "$(state_value source_sha "$RECOVERY_AUDIT_FILE")" = "$REQUESTED_ROLLBACK_SHA"
                test "$(state_value image "$RECOVERY_AUDIT_FILE")" = "$RECOVERY_IMAGE_ID"
                test "$(state_value schema_revisions "$RECOVERY_AUDIT_FILE")" = "$CURRENT_SCHEMA_REVISIONS"
                test "$(state_value from_migration_sha "$RECOVERY_AUDIT_FILE")" = "$TARGET_SHA"
                state_value recovered_at "$RECOVERY_AUDIT_FILE" >/dev/null
                return
              fi
              audit_tmp="$(mktemp "$STATE_DIR/bot-production.migration-recovery.audit.XXXXXX")"
              printf 'recovered_at=%s\nsource_sha=%s\nimage=%s\nschema_revisions=%s\nfrom_migration_sha=%s\n' \
                "$(date --iso-8601=seconds)" "$REQUESTED_ROLLBACK_SHA" "$RECOVERY_IMAGE_ID" \
                "$CURRENT_SCHEMA_REVISIONS" "$TARGET_SHA" > "$audit_tmp"
              chmod 600 "$audit_tmp"
              mv "$audit_tmp" "$RECOVERY_AUDIT_FILE"
            }

            mark_recovery_journal_recovered() {
              current_phase="$(state_value phase "$RECOVERY_STATE_FILE")"
              if [ "$current_phase" = 'recovered' ]; then
                return
              fi
              [ "$current_phase" = 'prepared' ] || [ "$current_phase" = 'completed' ]
              journal_tmp="$(mktemp "$STATE_DIR/bot-production.migration-recovery.XXXXXX")"
              awk 'BEGIN { replaced = 0 } /^phase=/ { print "phase=recovered"; replaced += 1; next } { print } END { if (replaced != 1) exit 1 }' \
                "$RECOVERY_STATE_FILE" > "$journal_tmp"
              chmod 600 "$journal_tmp"
              mv "$journal_tmp" "$RECOVERY_STATE_FILE"
            }

            trap 'cleanup_recovery_context' EXIT

            if [ -n "$(git status --porcelain)" ]; then
              echo 'Refusing recovery: the server working tree is not exact.' >&2
              exit 10
            fi
            if find . -maxdepth 1 -type f \( -name '*override*.yml' -o -name '*override*.yaml' \) -print -quit | grep -q .; then
              echo 'Refusing recovery: a Compose override file is present on the server.' >&2
              exit 11
            fi
            if [ "$(df -Pk . | awk 'NR == 2 { print $4 }')" -lt "$MIN_FREE_KB" ]; then
              echo 'Refusing recovery: less than 2 GiB of free disk space.' >&2
              exit 12
            fi
            [[ "$REQUESTED_ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]

            # 🔴 02.09.2026: выкладка встала намертво — `git fetch` с боевого отвечал
            # «could not read Username for 'https://github.com'», хотя репозиторий ПУБЛИЧНЫЙ и
            # снаружи читается анонимно. Три перезапуска подряд не помогли.
            # 🟢 ДОКАЗАНО ТРАССИРОВКОЙ САМОГО GIT НА БОЕВОМ (`GIT_CURL_VERBOSE=1`):
            #     Recv header: HTTP/2 200      ← первый запрос, объявление ссылок
            #     Recv header: HTTP/2 401
            #     Recv header: www-authenticate: Basic realm="GitHub"   ← второй запрос
            # То есть GitHub отдаёт объявление анонимно, а на РАБОЧИЙ запрос требует
            # представиться. Лечение одно: приходить не безымянно.
            # ⚠️ ЛОВУШКА, НА КОТОРОЙ Я СПОТКНУЛСЯ САМ, И СКЕПТИК ТОЖЕ: `curl` на тот же адрес
            # отвечает 200 и создаёт впечатление, что всё в порядке. Он посылает ПУСТОЙ запрос,
            # и GitHub вежливо отвечает «200, ноль байт». Проверять надо трассировкой git, а не
            # curl'ом.
            # ⚠️ Переключение на протокол версии 1 НЕ помогает — проверено, меняет только текст
            # ошибки: 401 приходит на второй запрос в любой версии протокола.
            # 🟢 Токен даёт сам GitHub на время прогона, он живёт минуты и гаснет вместе с ним;
            # на сервере ничего не заводится и не хранится, в `git config` не пишется.
            # ⛔ Не эхоить $GH_TOKEN и не включать `set -x` в этом шаге.
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            CURRENT_SOURCE_SHA="$(git rev-parse HEAD)"
            REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
            CURRENT_IMAGE_ID="$(docker inspect --format '{{.Image}}' remnawave_bot)"
            CURRENT_SERVICE_IMAGE="$(docker inspect --format '{{.Config.Image}}' remnawave_bot)"
            CURRENT_SCHEMA_REVISIONS="$(read_schema_revisions)"
            test -n "$CURRENT_SCHEMA_REVISIONS"

            RECOVERY_DECISION="$(.github/scripts/classify-migration-recovery.sh \
              "$RECOVERY_STATE_FILE" "$STATE_FILE" "$TARGET_SHA" "$REQUESTED_ROLLBACK_SHA" \
              "$REMOTE_MAIN_SHA" "$CURRENT_SOURCE_SHA" "$CURRENT_IMAGE_ID" "$CURRENT_SCHEMA_REVISIONS")"

            RECOVERY_IMAGE_TAG="$(state_value rollback_image_tag "$RECOVERY_STATE_FILE")"
            RECOVERY_IMAGE_ID="$(state_value rollback_image_id "$RECOVERY_STATE_FILE")"
            MIGRATION_IMAGE_ID="$(state_value migration_image_id "$RECOVERY_STATE_FILE")"

            # The classifier has already bound current main, source, image,
            # schema, deploy state and the v2 journal to one safe decision.
            git cat-file -e "${REQUESTED_ROLLBACK_SHA}^{commit}"
            git merge-base --is-ancestor "$REQUESTED_ROLLBACK_SHA" "$TARGET_SHA"
            if ! git diff --quiet "$REQUESTED_ROLLBACK_SHA" "$TARGET_SHA" -- Dockerfile .dockerignore docker-compose.yml; then
              echo 'Refusing recovery: Docker or Compose changed between the captured source and migration target.' >&2
              exit 13
            fi
            test "$(docker image inspect --format '{{.Id}}' "$RECOVERY_IMAGE_TAG")" = "$RECOVERY_IMAGE_ID"
            docker image inspect "$MIGRATION_IMAGE_ID" >/dev/null

            if [ "$RECOVERY_DECISION" = 'already_recovered' ]; then
              test "$(docker inspect --format '{{.State.Health.Status}}' remnawave_bot)" = 'healthy'
              started_at="$(docker inspect --format '{{.State.StartedAt}}' remnawave_bot)"
              docker logs --since "$started_at" remnawave_bot 2>&1 | grep -F 'SKIP_MIGRATION=true' >/dev/null
              docker logs --since "$started_at" remnawave_bot 2>&1 | grep -F 'Aiogram polling запущен' >/dev/null
              test "$(read_schema_revisions)" = "$CURRENT_SCHEMA_REVISIONS"
              if [ "$(state_value phase "$RECOVERY_STATE_FILE")" = 'recovered' ]; then
                # `recovered` is written only after the keyed audit. Its
                # absence therefore signals lost or contradictory durable
                # state and must never be silently reconstructed.
                test -r "$RECOVERY_AUDIT_FILE"
              fi
              ensure_recovery_audit
              mark_recovery_journal_recovered
              echo "Recovery already complete for source=$REQUESTED_ROLLBACK_SHA schema=$CURRENT_SCHEMA_REVISIONS"
              exit 0
            fi

            test "$RECOVERY_DECISION" = 'start_recovery' -o "$RECOVERY_DECISION" = 'continue_recovery'

            RECOVERY_DIR="$(mktemp -d /tmp/teplo-vpn-bot-recovery.XXXXXX)"
            RECOVERY_OVERRIDE="$RECOVERY_DIR/compose-recovery.yml"
            printf '%s\n' \
              'services:' \
              '  bot:' \
              '    environment:' \
              "      SKIP_MIGRATION: 'true'" > "$RECOVERY_OVERRIDE"

            trap handle_recovery_failure ERR
            docker image tag "$RECOVERY_IMAGE_TAG" "$CURRENT_SERVICE_IMAGE"
            RECOVERY_SWITCH_ATTEMPTED=1
            test "$(read_schema_revisions)" = "$CURRENT_SCHEMA_REVISIONS"
            compose up -d --no-build --wait --wait-timeout 240 "$SERVICE"
            compose ps "$SERVICE"
            running_image="$(docker inspect --format '{{.Image}}' remnawave_bot)"
            test "$running_image" = "$RECOVERY_IMAGE_ID"
            test "$(docker inspect --format '{{.State.Health.Status}}' remnawave_bot)" = 'healthy'
            started_at="$(docker inspect --format '{{.State.StartedAt}}' remnawave_bot)"
            docker logs --since "$started_at" remnawave_bot 2>&1 | grep -F 'SKIP_MIGRATION=true' >/dev/null
            docker logs --since "$started_at" remnawave_bot 2>&1 | grep -F 'Aiogram polling запущен' >/dev/null
            actual_revisions="$(read_schema_revisions)"
            test "$actual_revisions" = "$CURRENT_SCHEMA_REVISIONS"
            RECOVERY_OLD_IMAGE_VERIFIED=1

            git checkout --detach "$REQUESTED_ROLLBACK_SHA"
            write_recovery_state
            ensure_recovery_audit
            mark_recovery_journal_recovered
            RECOVERY_SWITCH_ATTEMPTED=0
            trap - ERR
            echo "Recovered source=$REQUESTED_ROLLBACK_SHA against schema=$actual_revisions at $(date --iso-8601=seconds)"
