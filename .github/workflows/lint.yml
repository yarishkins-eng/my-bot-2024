name: Lint

on:
  # release.yml calls this workflow as a reusable job for tagged releases.
  workflow_call:
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Prove entitlement shadow hard-kill recovery with real Docker
        if: >-
          hashFiles('.github/scripts/watchdog-entitlement-shadow-bootstrap.sh') != ''
        env:
          TEPLO_REQUIRE_REAL_DOCKER_SHADOW_TEST: '1'
        run: uv run pytest -q tests/workflows/test_entitlement_shadow_control_workflow.py -k real_docker_watchdog
