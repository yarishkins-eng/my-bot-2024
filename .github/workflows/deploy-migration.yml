name: Deploy bot migration to production

# This is deliberately manual. The normal deployment workflow refuses commits that add Alembic files.
on:
  workflow_dispatch:
    inputs:
      backup_and_restore_evidence:
        description: 'Exact phrase: BACKUP_RESTORE_VERIFIED'
        required: true
        type: string
      owner_go_no_go:
        description: 'Exact phrase: OWNER_APPROVED'
        required: true
        type: string
      release_card_reference:
        description: 'Private release-card / change record reference (no secrets)'
        required: true
        type: string

concurrency:
  group: teplo-bot-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/lint.yml

  deploy-migration:
    needs: verify
    runs-on: ubuntu-latest
    environment: teplo-vpn-production-migration
    timeout-minutes: 20
    steps:
      - name: Validate the documented migration gates
        env:
          BACKUP_AND_RESTORE_EVIDENCE: ${{ inputs.backup_and_restore_evidence }}
          OWNER_GO_NO_GO: ${{ inputs.owner_go_no_go }}
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
        run: |
          set -Eeuo pipefail
          test "$BACKUP_AND_RESTORE_EVIDENCE" = 'BACKUP_RESTORE_VERIFIED'
          test "$OWNER_GO_NO_GO" = 'OWNER_APPROVED'
          test -n "$RELEASE_CARD_REFERENCE"
          case "$RELEASE_CARD_REFERENCE" in
            *[!A-Za-z0-9._:/@-]*)
              echo 'Release-card reference contains unsupported characters.' >&2
              exit 1
              ;;
          esac

      - name: Deploy the exact migration revision and wait for health
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
          APPROVAL_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE_CARD_REFERENCE,APPROVAL_ACTOR
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            readonly REPO_DIR='/opt/remnawave-bedolaga-telegram-bot'
            readonly SERVICE='bot'
            readonly TARGET_SHA='${{ github.sha }}'
            readonly MIN_FREE_KB=2097152
            readonly STATE_DIR='/var/lib/teplo-vpn/deploy-state'
            readonly STATE_FILE="$STATE_DIR/bot-production.state"
            readonly RECOVERY_STATE_FILE="$STATE_DIR/bot-production.migration-recovery.state"
            readonly RECOVERY_IMAGE_TAG="teplo-vpn-rollback/bot:pre-migration-${TARGET_SHA}"
            readonly RELEASE_CARD_REFERENCE="${RELEASE_CARD_REFERENCE:?missing release-card reference}"
            readonly APPROVAL_ACTOR="${APPROVAL_ACTOR:?missing protected-deployment actor}"
            BUILD_DIR=''
            BUILD_OVERRIDE=''
            TARGET_SCHEMA_REVISIONS=''
            PREPARE_IN_PROGRESS=0
            RECOVERY_JOURNAL_PREPARED=0

            cd "$REPO_DIR"

            compose() {
              if [ -n "$BUILD_OVERRIDE" ]; then
                docker compose -f docker-compose.yml -f "$BUILD_OVERRIDE" "$@"
              else
                docker compose -f docker-compose.yml "$@"
              fi
            }

            cleanup_build_context() {
              if [ -n "$BUILD_DIR" ]; then
                rm -rf "$BUILD_DIR"
              fi
            }

            create_clean_build_context() {
              BUILD_DIR="$(mktemp -d /tmp/teplo-vpn-bot-build.XXXXXX)"
              BUILD_OVERRIDE="$BUILD_DIR/compose-build-context.yml"
              git archive "$TARGET_SHA" | tar -x -C "$BUILD_DIR"
              printf '%s\n' \
                'services:' \
                '  bot:' \
                '    build:' \
                "      context: $BUILD_DIR" \
                '      dockerfile: Dockerfile' > "$BUILD_OVERRIDE"
            }

            state_value() {
              key="$1"
              file="$2"
              test "$(grep -Ec "^${key}=[^[:space:]]+$" "$file")" = '1'
              sed -n "s/^${key}=//p" "$file"
            }

            read_schema_revisions() {
              docker compose -f docker-compose.yml exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT version_num FROM alembic_version ORDER BY version_num"' | sort | paste -sd, -
            }

            verify_deployed_state() {
              expected_sha="$1"
              test -r "$STATE_FILE"
              stored_sha="$(state_value sha "$STATE_FILE")"
              stored_image="$(state_value image "$STATE_FILE")"
              current_image="$(docker inspect --format '{{.Image}}' remnawave_bot)"
              test "$stored_sha" = "$expected_sha"
              [[ "$stored_image" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$stored_image" = "$current_image"
              test "$(docker inspect --format '{{.State.Health.Status}}' remnawave_bot)" = 'healthy'
            }

            write_deployed_state() {
              install -d -m 700 "$STATE_DIR"
              state_tmp="$(mktemp "$STATE_DIR/bot-production.XXXXXX")"
              printf 'sha=%s\nimage=%s\n' "$TARGET_SHA" "$(docker inspect --format '{{.Image}}' remnawave_bot)" > "$state_tmp"
              chmod 600 "$state_tmp"
              mv "$state_tmp" "$STATE_FILE"
            }

            # Write the journal before the service switch.  The recovery workflow
            # accepts only its captured SHA and image identity, so it remains
            # usable if Alembic commits but candidate startup fails.
            write_migration_recovery_state() {
              phase="$1"
              install -d -m 700 "$STATE_DIR"
              state_tmp="$(mktemp "$STATE_DIR/bot-production.migration-recovery.XXXXXX")"
              printf 'format_version=1\nphase=%s\ndeployed_sha=%s\nrollback_source_sha=%s\nrollback_image_tag=%s\nrollback_image_id=%s\nmigration_image_id=%s\nprevious_schema_revisions=%s\ntarget_schema_revisions=%s\n' \
                "$phase" "$TARGET_SHA" "$PREVIOUS_SHA" "$RECOVERY_IMAGE_TAG" "$PREVIOUS_IMAGE_ID" \
                "$TARGET_IMAGE_ID" "$PREVIOUS_SCHEMA_REVISIONS" "$TARGET_SCHEMA_REVISIONS" > "$state_tmp"
              chmod 600 "$state_tmp"
              mv "$state_tmp" "$RECOVERY_STATE_FILE"
            }

            # Until the recovery journal is durably written, no database or
            # service switch has happened.  A failed build/preparation must
            # leave the server at the exact prior source and deploy state so a
            # corrected retry is possible.  After `prepared`, recovery is
            # deliberately manual because Alembic may have committed.
            restore_after_preparation_failure() {
              original_rc=$?
              trap - ERR
              set +e
              restored=1
              if [ "$PREPARE_IN_PROGRESS" = '1' ] && [ "$RECOVERY_JOURNAL_PREPARED" = '0' ]; then
                echo 'Candidate preparation failed; restoring the prior source before any migration switch.' >&2
                git checkout --detach "$PREVIOUS_SHA" || restored=0
                # A leftover rollback *tag* is harmless; source, running
                # container, deploy-state, and schema are the recovery
                # invariants.  Do not turn a successful proof of those
                # invariants into a false CRITICAL merely because Docker has
                # already removed or cannot immediately untag this alias.
                if docker image inspect "$RECOVERY_IMAGE_TAG" >/dev/null 2>&1; then
                  docker image rm "$RECOVERY_IMAGE_TAG" >/dev/null 2>&1 || \
                    echo 'Warning: rollback image tag cleanup was deferred.' >&2
                fi
                verify_deployed_state "$PREVIOUS_SHA" || restored=0
              fi
              if [ "$restored" != '1' ]; then
                echo 'CRITICAL: candidate preparation failed and the prior source/state could not be proven restored.' >&2
                exit 91
              fi
              exit "$original_rc"
            }

            verify_migration_flags() {
              migration_flags="$(compose config 2>/dev/null | awk '/SKIP_MIGRATION:|ALLOW_MIGRATION_FAILURE:/ { print }')"
              if printf '%s\n' "$migration_flags" | grep -Eiq '(SKIP_MIGRATION|ALLOW_MIGRATION_FAILURE):.*(true|1)'; then
                echo 'Refusing migration deploy: target Compose config disables or tolerates migration failures.' >&2
                return 1
              fi
            }

            verify_migration_revision() {
              actual_revisions="$(read_schema_revisions)"
              test -n "$TARGET_SCHEMA_REVISIONS"
              test "$TARGET_SCHEMA_REVISIONS" = "$actual_revisions"
            }

            prepare_legacy_entitlement_baseline_if_required() {
              # Revision 0100 makes legacy tariff issuance fail closed until a
              # separately owner-approved manifest and per-subscription
              # evidence exist.  This one-time hook runs before the candidate
              # container switch, after the additive schema is available.
              if ! printf '%s\n' "$TARGET_SCHEMA_REVISIONS" | tr ',' '\n' | grep -qx '0100'; then
                return
              fi
              if printf '%s\n' "$PREVIOUS_SCHEMA_REVISIONS" | tr ',' '\n' | grep -qx '0100'; then
                return
              fi
              echo 'Applying additive schema and the owner-approved legacy entitlement baseline before service switch.'
              compose run --rm --no-deps --entrypoint /app/.venv/bin/alembic "$SERVICE" upgrade head
              verify_migration_revision
              compose run --rm --no-deps --entrypoint /app/.venv/bin/python "$SERVICE" \
                -m app.services.legacy_entitlement_manifest_seed \
                --approval-actor "$APPROVAL_ACTOR" \
                --approval-reference "$RELEASE_CARD_REFERENCE"
            }

            requires_legacy_entitlement_baseline() {
              printf '%s\n' "$TARGET_SCHEMA_REVISIONS" | tr ',' '\n' | grep -qx '0100' && \
                ! printf '%s\n' "$PREVIOUS_SCHEMA_REVISIONS" | tr ',' '\n' | grep -qx '0100'
            }

            quiesce_writer_before_legacy_entitlement_baseline() {
              # The old bot does not create immutable subscription evidence.
              # Stop the sole application writer only after candidate build and
              # recovery journal are proven, so no subscription can be created
              # between the legacy seed and the new fail-closed code.
              if ! requires_legacy_entitlement_baseline; then
                return
              fi
              echo 'Quiescing the bot writer before the legacy entitlement schema and seed.'
              compose stop --timeout 90 "$SERVICE"
              test "$(docker inspect --format '{{.State.Running}}' remnawave_bot)" = 'false'
              test "$(docker inspect --format '{{.State.Status}}' remnawave_bot)" = 'exited'
            }

            trap cleanup_build_context EXIT

            if [ -n "$(git status --porcelain)" ]; then
              echo 'Refusing migration deploy: the server working tree is not an exact tracked source tree.' >&2
              exit 20
            fi

            if find . -maxdepth 1 -type f \( -name '*override*.yml' -o -name '*override*.yaml' \) -print -quit | grep -q .; then
              echo 'Refusing migration deploy: a Compose override file is present on the server.' >&2
              exit 21
            fi

            if [ "$(df -Pk . | awk 'NR == 2 { print $4 }')" -lt "$MIN_FREE_KB" ]; then
              echo 'Refusing migration deploy: less than 2 GiB of free disk space.' >&2
              exit 22
            fi

            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            readonly PREVIOUS_SHA="$(git rev-parse HEAD)"
            readonly REMOTE_MAIN_SHA="$(git rev-parse origin/main)"

            if [ "$TARGET_SHA" != "$REMOTE_MAIN_SHA" ]; then
              echo "Refusing migration deploy: workflow=$TARGET_SHA, origin/main=$REMOTE_MAIN_SHA." >&2
              exit 23
            fi

            git cat-file -e "${TARGET_SHA}^{commit}"
            readonly SERVICE_IMAGE="$(docker inspect --format '{{.Config.Image}}' remnawave_bot)"
            readonly RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' remnawave_bot)"

            if [ "$PREVIOUS_SHA" = "$TARGET_SHA" ]; then
              echo "Source already at $TARGET_SHA; requiring the container health gate again."
              verify_deployed_state "$TARGET_SHA"
              # Compose names images by a mutable tag.  On a retry, that tag
              # must still resolve to the image already proved by deploy state;
              # otherwise `up --no-build` could replace a healthy bot with an
              # unrelated local image.
              test "$(docker image inspect --format '{{.Id}}' "$SERVICE_IMAGE")" = "$RUNNING_IMAGE_ID"
              verify_migration_flags
              # Use Compose to parse the production .env.  Docker's --env-file
              # treats inline comments as literal value text, while Compose
              # accepts the live file exactly as the bot itself does.  `run`
              # creates one disposable container; it does not run migrations.
              TARGET_SCHEMA_REVISIONS="$(compose run --rm --no-deps --entrypoint /app/.venv/bin/alembic "$SERVICE" heads | awk '{ print $1 }' | sort | paste -sd, -)"
              test -n "$TARGET_SCHEMA_REVISIONS"
              compose up -d --no-build --wait --wait-timeout 240 "$SERVICE"
              compose ps "$SERVICE"
              verify_migration_revision
              exit 0
            fi

            if ! git merge-base --is-ancestor "$PREVIOUS_SHA" "$TARGET_SHA"; then
              echo "Refusing migration deploy: server commit $PREVIOUS_SHA is not an ancestor of $TARGET_SHA." >&2
              exit 24
            fi

            if git diff --quiet "$PREVIOUS_SHA" "$TARGET_SHA" -- migrations alembic.ini app/database main.py app/config.py; then
              echo 'Refusing migration workflow: no database or migration-risk change was found.' >&2
              exit 25
            fi

            if ! git diff --quiet "$PREVIOUS_SHA" "$TARGET_SHA" -- Dockerfile .dockerignore docker-compose.yml; then
              echo 'Refusing migration deploy: Docker or Compose changes require a separately approved combined release.' >&2
              exit 26
            fi

            # Refuse to relabel an unknown running image as the prior source.
            # The ordinary deploy state is part of the migration pre-flight.
            verify_deployed_state "$PREVIOUS_SHA"
            readonly PREVIOUS_SCHEMA_REVISIONS="$(read_schema_revisions)"
            test -n "$PREVIOUS_SCHEMA_REVISIONS"
            readonly PREVIOUS_IMAGE_ID="$RUNNING_IMAGE_ID"
            docker image tag "$PREVIOUS_IMAGE_ID" "$RECOVERY_IMAGE_TAG"

            PREPARE_IN_PROGRESS=1
            trap restore_after_preparation_failure ERR
            git checkout --detach "$TARGET_SHA"
            verify_migration_flags
            create_clean_build_context
            compose build "$SERVICE"
            readonly TARGET_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$SERVICE_IMAGE")"
            # Keep the pre-switch probe on the same configuration parser as
            # the running service.  This one-off command only reads Alembic
            # heads; it cannot apply a migration.
            TARGET_SCHEMA_REVISIONS="$(compose run --rm --no-deps --entrypoint /app/.venv/bin/alembic "$SERVICE" heads | awk '{ print $1 }' | sort | paste -sd, -)"
            test -n "$TARGET_SCHEMA_REVISIONS"
            write_migration_recovery_state prepared
            RECOVERY_JOURNAL_PREPARED=1
            PREPARE_IN_PROGRESS=0
            trap - ERR

            quiesce_writer_before_legacy_entitlement_baseline
            prepare_legacy_entitlement_baseline_if_required

            # No automatic code rollback after quiescing the writer: the old
            # image cannot issue immutable entitlement snapshots and therefore
            # must never run on schema 0100.  If a forward migration commits
            # but this candidate cannot start, the bot deliberately remains
            # stopped for protected manual reconciliation; no old writer is
            # permitted to create unsupported subscriptions in the meantime.
            compose up -d --wait --wait-timeout 240 "$SERVICE"
            compose ps "$SERVICE"
            verify_migration_revision
            write_deployed_state
            write_migration_recovery_state completed
            echo "Container healthy and database revision verified for $TARGET_SHA at $(date --iso-8601=seconds)"
