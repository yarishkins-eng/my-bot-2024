name: Deploy bot infrastructure to production

# Normal deploys refuse Docker/Compose changes. This workflow is deliberately manual because
# those files can change build inputs, networking, volumes and the safety of a rollback.
on:
  workflow_dispatch:
    inputs:
      owner_go_no_go:
        description: 'Exact phrase: OWNER_APPROVED'
        required: true
        type: string
      release_card_reference:
        description: 'Private release-card / change record reference (no secrets)'
        required: true
        type: string
      rollback_plan_reference:
        description: 'Approved rollback plan reference (no secrets)'
        required: true
        type: string

concurrency:
  group: teplo-bot-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/lint.yml

  deploy-infrastructure:
    needs: verify
    runs-on: ubuntu-latest
    environment: teplo-vpn-production-controlled-change
    timeout-minutes: 20
    steps:
      - name: Validate controlled-change gates
        env:
          OWNER_GO_NO_GO: ${{ inputs.owner_go_no_go }}
          RELEASE_CARD_REFERENCE: ${{ inputs.release_card_reference }}
          ROLLBACK_PLAN_REFERENCE: ${{ inputs.rollback_plan_reference }}
        run: |
          set -Eeuo pipefail
          test "$OWNER_GO_NO_GO" = 'OWNER_APPROVED'
          test -n "$RELEASE_CARD_REFERENCE"
          test -n "$ROLLBACK_PLAN_REFERENCE"

      - name: Deploy the exact controlled infrastructure revision and wait for health
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            readonly REPO_DIR='/opt/remnawave-bedolaga-telegram-bot'
            readonly SERVICE='bot'
            readonly TARGET_SHA='${{ github.sha }}'
            readonly MIN_FREE_KB=2097152
            readonly STATE_DIR='/var/lib/teplo-vpn/deploy-state'
            readonly STATE_FILE="$STATE_DIR/bot-production.state"
            readonly CONTROL_PLANE_JOURNAL="$STATE_DIR/bot-production.control-plane-transition.state"
            readonly SHADOW_RUNTIME_DIR='/var/lib/teplo-vpn/entitlement-shadow-runtime'
            readonly SHADOW_CONTROL_LOCK_FILE="$STATE_DIR/bot-production.entitlement-shadow-control.lock"
            BUILD_DIR=''
            BUILD_OVERRIDE=''

            cd "$REPO_DIR"
            install -d -m 700 "$STATE_DIR"
            exec 8>"$SHADOW_CONTROL_LOCK_FILE"
            flock -w 30 8 || {
              echo 'Refusing controlled deploy: shadow control is busy.' >&2
              exit 64
            }
            test ! -e "$SHADOW_RUNTIME_DIR/lease.state" || {
              echo 'Refusing controlled deploy: disable the active shadow lease first.' >&2
              exit 64
            }
            test ! -e "$SHADOW_RUNTIME_DIR/disable.state" || {
              echo 'Refusing controlled deploy: a shadow disable is still in progress.' >&2
              exit 64
            }
            test ! -e "$SHADOW_RUNTIME_DIR/failed-enable-cleanup.state" || {
              echo 'Refusing controlled deploy: a failed shadow enable cleanup is still in progress.' >&2
              exit 64
            }
            docker info >/dev/null 2>&1 || {
              echo 'Refusing controlled deploy: Docker state cannot be verified.' >&2
              exit 64
            }
            shadow_container_ids="$(docker container ls -a --no-trunc \
              --filter 'name=^/teplo_entitlement_shadow$' --format '{{.ID}}')" || {
              echo 'Refusing controlled deploy: the shadow sidecar state cannot be verified.' >&2
              exit 64
            }
            [ -z "$shadow_container_ids" ] || {
              echo 'Refusing controlled deploy: disable the shadow sidecar first.' >&2
              exit 64
            }

            compose() {
              if [ -n "$BUILD_OVERRIDE" ]; then
                docker compose -f docker-compose.yml -f "$BUILD_OVERRIDE" "$@"
              else
                docker compose -f docker-compose.yml "$@"
              fi
            }

            cleanup_build_context() {
              if [ -n "$BUILD_DIR" ]; then
                rm -rf "$BUILD_DIR"
              fi
            }

            create_clean_build_context() {
              BUILD_DIR="$(mktemp -d /tmp/teplo-vpn-bot-build.XXXXXX)"
              BUILD_OVERRIDE="$BUILD_DIR/compose-build-context.yml"
              git archive "$TARGET_SHA" | tar -x -C "$BUILD_DIR"
              printf '%s\n' \
                'services:' \
                '  bot:' \
                '    build:' \
                "      context: $BUILD_DIR" \
                '      dockerfile: Dockerfile' > "$BUILD_OVERRIDE"
            }

            verify_deployed_state() {
              test -r "$STATE_FILE"
              stored_sha="$(sed -n 's/^sha=//p' "$STATE_FILE")"
              stored_image="$(sed -n 's/^image=//p' "$STATE_FILE")"
              current_image="$(docker inspect --format '{{.Image}}' remnawave_bot)"
              test "$stored_sha" = "$TARGET_SHA"
              test "$stored_image" = "$current_image"
            }

            write_deployed_state_for() {
              deployed_sha="$1"
              expected_container_id="$2"
              expected_image="$3"
              expected_started_at="$4"
              [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$expected_container_id" =~ ^[0-9a-f]{64}$ ]]
              [[ "$expected_image" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$expected_started_at" =~ ^[^[:space:]]+$ ]]
              install -d -m 700 "$STATE_DIR"
              state_tmp="$(mktemp "$STATE_DIR/bot-production.XXXXXX")"
              printf 'sha=%s\nimage=%s\n' "$deployed_sha" "$expected_image" > "$state_tmp"
              chmod 600 "$state_tmp"
              mv "$state_tmp" "$STATE_FILE"
            }

            write_deployed_state() {
              write_deployed_state_for \
                "$TARGET_SHA" "$PREVIOUS_CONTAINER_ID" "$PREVIOUS_IMAGE_ID" "$PREVIOUS_STARTED_AT"
            }

            capture_bot_snapshot() {
              BOT_SNAPSHOT_ID=''
              BOT_SNAPSHOT_IMAGE=''
              BOT_SNAPSHOT_STARTED_AT=''
              BOT_SNAPSHOT_HEALTH=''
              BOT_SNAPSHOT_RUNNING=''
              BOT_SNAPSHOT_PAUSED=''
              bot_snapshot_raw="$(docker inspect --format '{{.Id}}|{{.Image}}|{{.State.StartedAt}}|{{.State.Health.Status}}|{{.State.Running}}|{{.State.Paused}}' remnawave_bot)" || {
                echo 'Refusing controlled deploy: bot snapshot cannot be verified.' >&2
                return 1
              }
              IFS='|' read -r BOT_SNAPSHOT_ID BOT_SNAPSHOT_IMAGE BOT_SNAPSHOT_STARTED_AT \
                BOT_SNAPSHOT_HEALTH BOT_SNAPSHOT_RUNNING BOT_SNAPSHOT_PAUSED BOT_SNAPSHOT_EXTRA \
                <<< "$bot_snapshot_raw"
              test -z "$BOT_SNAPSHOT_EXTRA"
              [[ "$BOT_SNAPSHOT_ID" =~ ^[0-9a-f]{64}$ ]]
              [[ "$BOT_SNAPSHOT_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$BOT_SNAPSHOT_STARTED_AT" =~ ^[^[:space:]]+$ ]]
              test "$BOT_SNAPSHOT_HEALTH" = 'healthy'
              test "$BOT_SNAPSHOT_RUNNING" = 'true'
              test "$BOT_SNAPSHOT_PAUSED" = 'false'
            }

            journal_value() {
              key="$1"
              count="$(grep -Ec "^${key}=[^[:space:]]+$" "$CONTROL_PLANE_JOURNAL" 2>/dev/null || true)"
              test "$count" = '1'
              sed -n "s/^${key}=//p" "$CONTROL_PLANE_JOURNAL"
            }

            write_control_plane_journal() {
              base_sha="$1"
              container_id="$2"
              image_id="$3"
              started_at="$4"
              journal_tmp="$(mktemp "$STATE_DIR/bot-production.control-plane-transition.XXXXXX")"
              printf 'format_version=1\nphase=prepared\nbase_sha=%s\ntarget_sha=%s\ncontainer_id=%s\nimage=%s\nstarted_at=%s\n' \
                "$base_sha" "$TARGET_SHA" "$container_id" "$image_id" "$started_at" > "$journal_tmp"
              chmod 600 "$journal_tmp"
              mv "$journal_tmp" "$CONTROL_PLANE_JOURNAL"
            }

            trap cleanup_build_context EXIT

            if [ -n "$(git status --porcelain)" ]; then
              echo 'Refusing controlled deploy: the server working tree is not an exact tracked source tree.' >&2
              exit 30
            fi

            if find . -maxdepth 1 -type f \( -name '*override*.yml' -o -name '*override*.yaml' \) -print -quit | grep -q .; then
              echo 'Refusing controlled deploy: a Compose override file is present on the server.' >&2
              exit 31
            fi

            if [ "$(df -Pk . | awk 'NR == 2 { print $4 }')" -lt "$MIN_FREE_KB" ]; then
              echo 'Refusing controlled deploy: less than 2 GiB of free disk space.' >&2
              exit 32
            fi

            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
            [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REMOTE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
            readonly PREVIOUS_SHA REMOTE_MAIN_SHA
            DEPLOY_BASE_SHA="$PREVIOUS_SHA"
            CONTROL_PLANE_JOURNAL_READY=0

            if [ "$TARGET_SHA" != "$REMOTE_MAIN_SHA" ]; then
              echo "Refusing controlled deploy: workflow=$TARGET_SHA, origin/main=$REMOTE_MAIN_SHA." >&2
              exit 33
            fi

            if [ -e "$CONTROL_PLANE_JOURNAL" ] && [ "$(journal_value target_sha)" != "$TARGET_SHA" ]; then
              stale_base_sha="$(journal_value base_sha)"
              stale_target_sha="$(journal_value target_sha)"
              stale_state_sha="$(sed -n 's/^sha=//p' "$STATE_FILE")"
              stale_state_image="$(sed -n 's/^image=//p' "$STATE_FILE")"
              test "$(journal_value format_version)" = '1'
              test "$(journal_value phase)" = 'prepared'
              [[ "$stale_base_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$stale_target_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$stale_state_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$stale_state_image" =~ ^sha256:[0-9a-f]{64}$ ]]
              git cat-file -e "${stale_base_sha}^{commit}"
              git cat-file -e "${stale_target_sha}^{commit}"
              git merge-base --is-ancestor "$stale_base_sha" "$stale_target_sha"
              git merge-base --is-ancestor "$stale_target_sha" "$TARGET_SHA"
              capture_bot_snapshot
              test "$(journal_value image)" = "$BOT_SNAPSHOT_IMAGE"
              test "$(journal_value container_id)" = "$BOT_SNAPSHOT_ID"
              test "$(journal_value started_at)" = "$BOT_SNAPSHOT_STARTED_AT"
              test "$stale_state_image" = "$BOT_SNAPSHOT_IMAGE"

              if [ "$PREVIOUS_SHA" = "$stale_base_sha" ] && [ "$stale_state_sha" = "$stale_base_sha" ]; then
                rm -f -- "$CONTROL_PLANE_JOURNAL"
                echo "Cancelled an interrupted pre-checkout control-plane transition to $stale_target_sha." >&2
                exit 64
              fi
              if [ "$PREVIOUS_SHA" = "$stale_target_sha" ] && [ "$stale_state_sha" = "$stale_base_sha" ]; then
                write_deployed_state_for \
                  "$stale_target_sha" "$BOT_SNAPSHOT_ID" "$BOT_SNAPSHOT_IMAGE" "$BOT_SNAPSHOT_STARTED_AT"
                capture_bot_snapshot
                test "$BOT_SNAPSHOT_ID" = "$(journal_value container_id)"
                test "$BOT_SNAPSHOT_IMAGE" = "$(journal_value image)"
                test "$BOT_SNAPSHOT_STARTED_AT" = "$(journal_value started_at)"
                rm -f -- "$CONTROL_PLANE_JOURNAL"
                echo "Finalized the interrupted control-plane transition to $stale_target_sha; start a new protected run for $TARGET_SHA." >&2
                exit 64
              fi
              if [ "$PREVIOUS_SHA" = "$stale_target_sha" ] && [ "$stale_state_sha" = "$stale_target_sha" ]; then
                rm -f -- "$CONTROL_PLANE_JOURNAL"
                echo "Cleared the completed control-plane transition to $stale_target_sha; start a new protected run for $TARGET_SHA." >&2
                exit 64
              fi
              echo 'Refusing controlled deploy: stale control-plane journal state is not safely reconcilable.' >&2
              exit 38
            fi

            if [ "$PREVIOUS_SHA" = "$TARGET_SHA" ]; then
              stored_sha="$(sed -n 's/^sha=//p' "$STATE_FILE")"
              stored_image="$(sed -n 's/^image=//p' "$STATE_FILE")"
              capture_bot_snapshot
              current_image="$BOT_SNAPSHOT_IMAGE"
              [[ "$stored_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$stored_image" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$current_image" =~ ^sha256:[0-9a-f]{64}$ ]]
              if [ "$stored_sha" = "$TARGET_SHA" ]; then
                if [ -e "$CONTROL_PLANE_JOURNAL" ]; then
                  test "$(journal_value format_version)" = '1'
                  test "$(journal_value phase)" = 'prepared'
                  test "$(journal_value target_sha)" = "$TARGET_SHA"
                  test "$(journal_value image)" = "$current_image"
                  test "$(journal_value container_id)" = "$BOT_SNAPSHOT_ID"
                  test "$(journal_value started_at)" = "$BOT_SNAPSHOT_STARTED_AT"
                  rm -f -- "$CONTROL_PLANE_JOURNAL"
                fi
                echo "Source already at $TARGET_SHA; requiring the container health gate again."
                verify_deployed_state
                test "$BOT_SNAPSHOT_HEALTH" = 'healthy'
                compose ps "$SERVICE"
                exit 0
              fi
              test -r "$CONTROL_PLANE_JOURNAL" || {
                echo 'Refusing controlled deploy recovery: the prepared journal is missing.' >&2
                exit 38
              }
              test "$(journal_value format_version)" = '1'
              test "$(journal_value phase)" = 'prepared'
              test "$(journal_value base_sha)" = "$stored_sha"
              test "$(journal_value target_sha)" = "$TARGET_SHA"
              test "$stored_image" = "$current_image" || {
                echo 'Refusing controlled deploy recovery: the recorded image changed.' >&2
                exit 38
              }
              test "$(journal_value image)" = "$current_image"
              test "$(journal_value container_id)" = "$BOT_SNAPSHOT_ID"
              test "$(journal_value started_at)" = "$BOT_SNAPSHOT_STARTED_AT"
              CONTROL_PLANE_JOURNAL_READY=1
              git merge-base --is-ancestor "$stored_sha" "$TARGET_SHA" || {
                echo 'Refusing controlled deploy recovery: the recorded source is not an ancestor.' >&2
                exit 38
              }
              DEPLOY_BASE_SHA="$stored_sha"
              echo "Recovering an interrupted source-only transition from $stored_sha to $TARGET_SHA."
            elif [ -e "$CONTROL_PLANE_JOURNAL" ]; then
              capture_bot_snapshot
              test "$(journal_value format_version)" = '1'
              test "$(journal_value phase)" = 'prepared'
              test "$(journal_value base_sha)" = "$PREVIOUS_SHA"
              test "$(journal_value target_sha)" = "$TARGET_SHA"
              test "$(journal_value image)" = "$BOT_SNAPSHOT_IMAGE"
              test "$(journal_value container_id)" = "$BOT_SNAPSHOT_ID"
              test "$(journal_value started_at)" = "$BOT_SNAPSHOT_STARTED_AT"
              CONTROL_PLANE_JOURNAL_READY=1
              echo "Continuing a prepared source-only transition from $PREVIOUS_SHA to $TARGET_SHA."
            fi

            if ! git merge-base --is-ancestor "$DEPLOY_BASE_SHA" "$TARGET_SHA"; then
              echo "Refusing controlled deploy: server commit $DEPLOY_BASE_SHA is not an ancestor of $TARGET_SHA." >&2
              exit 34
            fi

            infrastructure_paths_changed=0
            control_plane_paths_changed=0
            git diff --quiet "$DEPLOY_BASE_SHA" "$TARGET_SHA" -- Dockerfile .dockerignore docker-compose.yml || infrastructure_paths_changed=1
            git diff --quiet "$DEPLOY_BASE_SHA" "$TARGET_SHA" -- \
              .github/scripts/control-entitlement-shadow.sh \
              .github/scripts/disable-entitlement-shadow.sh \
              .github/scripts/run-entitlement-shadow-sidecar.py \
              .github/scripts/verify-entitlement-shadow-baseline.py \
              .github/scripts/watchdog-entitlement-shadow-bootstrap.sh \
              .github/workflows/control-entitlement-shadow.yml \
              .github/workflows/deploy-infrastructure.yml \
              .github/workflows/deploy-migration.yml \
              .github/workflows/deploy.yml \
              .github/workflows/lint.yml \
              .github/workflows/recover-after-migration.yml || control_plane_paths_changed=1
            if [ "$infrastructure_paths_changed" = '0' ] && [ "$control_plane_paths_changed" = '0' ]; then
              echo 'Refusing controlled deploy: no allowlisted infrastructure or control-plane change was found.' >&2
              exit 35
            fi

            if [ "$infrastructure_paths_changed" = '1' ] && [ -e "$CONTROL_PLANE_JOURNAL" ]; then
              echo 'Refusing controlled infrastructure deploy: a source-only control-plane transition is still prepared.' >&2
              exit 64
            fi

            if [ "$infrastructure_paths_changed" = '0' ]; then
              unexpected_control_plane_paths="$(
                git diff --name-only "$DEPLOY_BASE_SHA" "$TARGET_SHA" | grep -Ev '^(\.github/(scripts/(control-entitlement-shadow\.sh|disable-entitlement-shadow\.sh|run-entitlement-shadow-sidecar\.py|verify-entitlement-shadow-baseline\.py|watchdog-entitlement-shadow-bootstrap\.sh)|workflows/(control-entitlement-shadow\.yml|deploy-infrastructure\.yml|deploy-migration\.yml|deploy\.yml|lint\.yml|recover-after-migration\.yml))|docs/entitlement_authority/gate2-shadow(-control-prerequisite)?-release-card\.md|tests/workflows/test_(entitlement_shadow_control|migration_recovery)_workflow\.py)$' || true
              )"
              if [ -n "$unexpected_control_plane_paths" ]; then
                echo 'Refusing controlled deploy: control-plane-only mode contains paths outside the reviewed allowlist.' >&2
                exit 37
              fi
            fi

            if ! git diff --quiet "$DEPLOY_BASE_SHA" "$TARGET_SHA" -- migrations alembic.ini app/database main.py app/config.py; then
              echo 'Refusing controlled deploy: database or migration-risk changes require the migration workflow.' >&2
              exit 36
            fi

            if [ "$infrastructure_paths_changed" = '0' ]; then
              capture_bot_snapshot
              PREVIOUS_CONTAINER_ID="$BOT_SNAPSHOT_ID"
              PREVIOUS_IMAGE_ID="$BOT_SNAPSHOT_IMAGE"
              PREVIOUS_STARTED_AT="$BOT_SNAPSHOT_STARTED_AT"
              readonly PREVIOUS_CONTAINER_ID PREVIOUS_IMAGE_ID PREVIOUS_STARTED_AT
              test "$(sed -n 's/^sha=//p' "$STATE_FILE")" = "$DEPLOY_BASE_SHA"
              test "$(sed -n 's/^image=//p' "$STATE_FILE")" = "$PREVIOUS_IMAGE_ID"

              if [ "$CONTROL_PLANE_JOURNAL_READY" = '0' ]; then
                write_control_plane_journal \
                  "$DEPLOY_BASE_SHA" "$PREVIOUS_CONTAINER_ID" "$PREVIOUS_IMAGE_ID" "$PREVIOUS_STARTED_AT"
              fi

              git checkout --detach "$TARGET_SHA"

              capture_bot_snapshot
              test "$BOT_SNAPSHOT_ID" = "$PREVIOUS_CONTAINER_ID"
              test "$BOT_SNAPSHOT_IMAGE" = "$PREVIOUS_IMAGE_ID"
              test "$BOT_SNAPSHOT_STARTED_AT" = "$PREVIOUS_STARTED_AT"
              write_deployed_state
              capture_bot_snapshot
              test "$BOT_SNAPSHOT_ID" = "$PREVIOUS_CONTAINER_ID"
              test "$BOT_SNAPSHOT_IMAGE" = "$PREVIOUS_IMAGE_ID"
              test "$BOT_SNAPSHOT_STARTED_AT" = "$PREVIOUS_STARTED_AT"
              rm -f -- "$CONTROL_PLANE_JOURNAL"
              echo "Protected control-plane source activated without rebuilding or restarting the bot at $(date --iso-8601=seconds)"
              exit 0
            fi

            git checkout --detach "$TARGET_SHA"
            create_clean_build_context
            compose build "$SERVICE"

            # No automatic rollback: infrastructure can make the previous image/config unsafe.
            # Follow the owner-approved rollback plan recorded in the release card on failure.
            compose up -d --wait --wait-timeout 240 "$SERVICE"
            compose ps "$SERVICE"
            capture_bot_snapshot
            write_deployed_state_for \
              "$TARGET_SHA" "$BOT_SNAPSHOT_ID" "$BOT_SNAPSHOT_IMAGE" "$BOT_SNAPSHOT_STARTED_AT"
            echo "Controlled container health confirmed for $TARGET_SHA at $(date --iso-8601=seconds)"
