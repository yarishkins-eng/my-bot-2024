name: Entitlement shadow one-shot control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Fixed control action
        required: true
        type: choice
        options:
          - ENABLE_SHADOW
          - DISABLE_SHADOW
      exact_deployed_sha:
        description: Exact already-deployed compatible source SHA
        required: true
        type: string
      owner_approval_phrase:
        description: Fixed owner approval phrase for the selected action
        required: true
        type: string
      release_card_reference:
        description: Exact repository release-card path
        required: true
        type: string

concurrency:
  group: teplo-bot-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: teplo-vpn-production-controlled-change
    env:
      COMPATIBLE_SHA: 39a0a0dcc5467f6cfe802629213dc3a57273ea25
      COMPATIBLE_IMAGE: sha256:35dd4dfcd12932fc2cba9c84ef0345ada97ec848e1c3cb8efe52d098873f9f86
      RELEASE_CARD: docs/entitlement_authority/gate2-2-one-shot-revalidation-release-card.md
      REMOTE_RUN_DIR: /tmp/teplo-shadow-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      request_actor: ${{ github.actor }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate fixed request and immutable primitives
        id: validate
        shell: bash
        env:
          REQUEST_ACTION: ${{ inputs.action }}
          REQUEST_DEPLOYED_SHA: ${{ inputs.exact_deployed_sha }}
          REQUEST_APPROVAL_PHRASE: ${{ inputs.owner_approval_phrase }}
          REQUEST_RELEASE_CARD: ${{ inputs.release_card_reference }}
        run: |
          set -Eeuo pipefail
          test '${{ github.ref }}' = 'refs/heads/main'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$(git rev-parse origin/main)" = '${{ github.sha }}'
          test "$REQUEST_DEPLOYED_SHA" = "$COMPATIBLE_SHA"
          test "$REQUEST_RELEASE_CARD" = "$RELEASE_CARD"
          case "$REQUEST_ACTION" in
            ENABLE_SHADOW)
              test "$REQUEST_APPROVAL_PHRASE" = 'OWNER_APPROVED_ENABLE_SHADOW'
              ;;
            DISABLE_SHADOW)
              test "$REQUEST_APPROVAL_PHRASE" = 'OWNER_APPROVED_DISABLE_SHADOW'
              ;;
            *) exit 64 ;;
          esac
          test -f "$RELEASE_CARD"
          controller_sha="$(sha256sum .github/scripts/entitlement-shadow-one-shot-control.sh | awk '{print $1}')"
          entrypoint_sha="$(sha256sum .github/scripts/entitlement_shadow_one_shot.py | awk '{print $1}')"
          printf 'controller_sha=%s\nentrypoint_sha=%s\n' "$controller_sha" "$entrypoint_sha" >> "$GITHUB_OUTPUT"
          printf 'request_actor=%s\ncompatible_image=%s\n' "$request_actor" "$COMPATIBLE_IMAGE"

      - name: Transfer exact one-shot primitives
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .github/scripts/entitlement-shadow-one-shot-control.sh,.github/scripts/entitlement_shadow_one_shot.py
          target: ${{ env.REMOTE_RUN_DIR }}
          strip_components: 2
          overwrite: false

      - name: Execute fixed protected action
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -Eeuo pipefail
            readonly RUN_DIR='${{ env.REMOTE_RUN_DIR }}'
            readonly CONTROLLER="$RUN_DIR/entitlement-shadow-one-shot-control.sh"
            readonly ENTRYPOINT="$RUN_DIR/entitlement_shadow_one_shot.py"
            cleanup_transfer() {
              rm -f "$CONTROLLER" "$ENTRYPOINT"
              rmdir "$RUN_DIR" 2>/dev/null || true
            }
            trap cleanup_transfer EXIT HUP INT TERM
            test "$(sha256sum "$CONTROLLER" | awk '{print $1}')" = '${{ steps.validate.outputs.controller_sha }}'
            test "$(sha256sum "$ENTRYPOINT" | awk '{print $1}')" = '${{ steps.validate.outputs.entrypoint_sha }}'
            chmod 700 "$CONTROLLER"
            chmod 444 "$ENTRYPOINT"
            "$CONTROLLER" '${{ inputs.action }}' "$ENTRYPOINT" '${{ steps.validate.outputs.entrypoint_sha }}'
