name: Deploy bot to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A deploy is executed against the exact commit that triggered this workflow.
# A newer push queues behind it; the older run then exits without changing the server.
concurrency:
  group: teplo-bot-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/lint.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy the exact non-migration revision and wait for health
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            readonly REPO_DIR='/opt/remnawave-bedolaga-telegram-bot'
            readonly SERVICE='bot'
            readonly TARGET_SHA='${{ github.sha }}'
            readonly MIN_FREE_KB=2097152
            readonly STATE_DIR='/var/lib/teplo-vpn/deploy-state'
            readonly STATE_FILE="$STATE_DIR/bot-production.state"
            readonly RECOVERY_STATE_FILE="$STATE_DIR/bot-production.migration-recovery.state"
            readonly CONTROL_PLANE_JOURNAL="$STATE_DIR/bot-production.control-plane-transition.state"
            readonly SHADOW_RUNTIME_DIR='/var/lib/teplo-vpn/entitlement-shadow-runtime'
            readonly SHADOW_CONTROL_LOCK_FILE="$STATE_DIR/bot-production.entitlement-shadow-control.lock"
            BUILD_DIR=''
            BUILD_OVERRIDE=''
            VERIFIED_DEPLOY_MODE=''
            VERIFIED_DEPLOY_IMAGE=''
            VERIFIED_DEPLOY_SCHEMA=''
            VERIFIED_RECOVERY_FROM_SHA=''

            cd "$REPO_DIR"
            install -d -m 700 "$STATE_DIR"
            exec 8>"$SHADOW_CONTROL_LOCK_FILE"
            flock -w 30 8 || {
              echo 'Refusing deploy: shadow control is busy.' >&2
              exit 64
            }
            test ! -e "$CONTROL_PLANE_JOURNAL" || {
              echo 'Refusing deploy: a protected control-plane transition is still prepared.' >&2
              exit 64
            }
            test ! -e "$SHADOW_RUNTIME_DIR/lease.state" || {
              echo 'Refusing deploy: disable the active shadow lease first.' >&2
              exit 64
            }
            test ! -e "$SHADOW_RUNTIME_DIR/disable.state" || {
              echo 'Refusing deploy: a shadow disable is still in progress.' >&2
              exit 64
            }
            test ! -e "$SHADOW_RUNTIME_DIR/failed-enable-cleanup.state" || {
              echo 'Refusing deploy: a failed shadow enable cleanup is still in progress.' >&2
              exit 64
            }
            docker info >/dev/null 2>&1 || {
              echo 'Refusing deploy: Docker state cannot be verified.' >&2
              exit 64
            }
            shadow_container_ids="$(docker container ls -a --no-trunc \
              --filter 'name=^/teplo_entitlement_shadow$' --format '{{.ID}}')" || {
              echo 'Refusing deploy: the shadow sidecar state cannot be verified.' >&2
              exit 64
            }
            [ -z "$shadow_container_ids" ] || {
              echo 'Refusing deploy: disable the shadow sidecar first.' >&2
              exit 64
            }

            compose() {
              if [ -n "$BUILD_OVERRIDE" ]; then
                docker compose -f docker-compose.yml -f "$BUILD_OVERRIDE" "$@"
              else
                docker compose -f docker-compose.yml "$@"
              fi
            }

            cleanup_build_context() {
              if [ -n "$BUILD_DIR" ]; then
                rm -rf "$BUILD_DIR"
              fi
            }

            create_clean_build_context() {
              BUILD_DIR="$(mktemp -d /tmp/teplo-vpn-bot-build.XXXXXX)"
              BUILD_OVERRIDE="$BUILD_DIR/compose-build-context.yml"
              git archive "$TARGET_SHA" | tar -x -C "$BUILD_DIR"
              printf '%s\n' \
                'services:' \
                '  bot:' \
                '    build:' \
                "      context: $BUILD_DIR" \
                '      dockerfile: Dockerfile' > "$BUILD_OVERRIDE"
            }

            state_value() {
              key="$1"
              file="$2"
              count="$(grep -Ec "^${key}=[^[:space:]]+$" "$file" || true)"
              if [ "$count" != '1' ]; then
                echo "Refusing deploy: missing or duplicate state key ${key}." >&2
                return 1
              fi
              sed -n "s/^${key}=//p" "$file"
            }

            read_schema_revisions() {
              docker compose -f docker-compose.yml exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT version_num FROM alembic_version ORDER BY version_num"' | sort | paste -sd, -
            }

            verify_deployed_state() {
              expected_sha="$1"
              test -r "$STATE_FILE" || return 1
              mode_count="$(grep -Ec '^mode=[^[:space:]]+$' "$STATE_FILE" || true)"
              if [ "$mode_count" = '0' ]; then
                if grep -Ev '^(sha|image)=[^[:space:]]+$' "$STATE_FILE" >/dev/null; then
                  echo 'Refusing deploy: malformed normal deploy state.' >&2
                  return 1
                fi
                VERIFIED_DEPLOY_MODE='normal'
                VERIFIED_DEPLOY_SCHEMA="$(read_schema_revisions)" || return 1
                [[ "$VERIFIED_DEPLOY_SCHEMA" =~ ^[0-9a-z]+(,[0-9a-z]+)*$ ]] || return 1
              elif [ "$mode_count" = '1' ]; then
                if grep -Ev '^(sha|image|mode|schema_revisions|recovery_from_sha)=[^[:space:]]+$' "$STATE_FILE" >/dev/null; then
                  echo 'Refusing deploy: malformed recovery deploy state.' >&2
                  return 1
                fi
                if [ "$(state_value mode "$STATE_FILE")" != 'recovery' ]; then
                  echo 'Refusing deploy: unknown deploy-state mode.' >&2
                  return 1
                fi
                stored_schema="$(state_value schema_revisions "$STATE_FILE")" || return 1
                recovery_from_sha="$(state_value recovery_from_sha "$STATE_FILE")" || return 1
                if ! [[ "$stored_schema" =~ ^[0-9a-z]+(,[0-9a-z]+)*$ ]]; then
                  echo 'Refusing deploy: invalid recovered schema revision.' >&2
                  return 1
                fi
                if ! [[ "$recovery_from_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo 'Refusing deploy: invalid recovery source SHA.' >&2
                  return 1
                fi
                if [ "$stored_schema" != "$(read_schema_revisions)" ]; then
                  echo 'Refusing deploy: recovered state disagrees with live schema.' >&2
                  return 1
                fi
                git cat-file -e "${recovery_from_sha}^{commit}" || return 1
                git merge-base --is-ancestor "$expected_sha" "$recovery_from_sha" || return 1
                git merge-base --is-ancestor "$recovery_from_sha" "$TARGET_SHA" || return 1
                VERIFIED_DEPLOY_MODE='recovery'
                VERIFIED_DEPLOY_SCHEMA="$stored_schema"
                VERIFIED_RECOVERY_FROM_SHA="$recovery_from_sha"
              else
                echo 'Refusing deploy: duplicate deploy-state mode.' >&2
                return 1
              fi
              stored_sha="$(state_value sha "$STATE_FILE")" || return 1
              stored_image="$(state_value image "$STATE_FILE")" || return 1
              current_image="$(docker inspect --format '{{.Image}}' remnawave_bot)" || return 1
              test "$stored_sha" = "$expected_sha" || return 1
              [[ "$stored_image" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              test "$stored_image" = "$current_image" || return 1
              test "$(docker inspect --format '{{.State.Health.Status}}' remnawave_bot)" = 'healthy' || return 1
              VERIFIED_DEPLOY_IMAGE="$stored_image"
            }

            verify_no_unresolved_migration() {
              if [ ! -e "$RECOVERY_STATE_FILE" ]; then
                if [ "$VERIFIED_DEPLOY_MODE" = 'recovery' ]; then
                  echo 'Refusing deploy: recovered deploy state has no migration journal.' >&2
                  return 1
                fi
                return
              fi
              test -r "$RECOVERY_STATE_FILE" || return 1
              format_version="$(state_value format_version "$RECOVERY_STATE_FILE")" || return 1
              case "$format_version" in
                1)
                  allowed_recovery_keys='^(format_version|phase|deployed_sha|rollback_source_sha|rollback_image_tag|rollback_image_id|migration_image_id|previous_schema_revisions|target_schema_revisions)=[^[:space:]]+$'
                  ;;
                2)
                  allowed_recovery_keys='^(format_version|phase|deployed_sha|rollback_source_sha|rollback_image_tag|rollback_image_id|migration_image_id|previous_schema_revisions|target_schema_revisions|old_image_target_schema_compatible)=[^[:space:]]+$'
                  ;;
                *)
                  echo 'Refusing deploy: unsupported migration journal version.' >&2
                  return 1
                  ;;
              esac
              if grep -Ev "$allowed_recovery_keys" "$RECOVERY_STATE_FILE" >/dev/null; then
                echo 'Refusing deploy: malformed migration journal.' >&2
                return 1
              fi
              recovery_phase="$(state_value phase "$RECOVERY_STATE_FILE")" || return 1
              recovery_deployed_sha="$(state_value deployed_sha "$RECOVERY_STATE_FILE")" || return 1
              recovery_source_sha="$(state_value rollback_source_sha "$RECOVERY_STATE_FILE")" || return 1
              recovery_image_tag="$(state_value rollback_image_tag "$RECOVERY_STATE_FILE")" || return 1
              recovery_image_id="$(state_value rollback_image_id "$RECOVERY_STATE_FILE")" || return 1
              migration_image_id="$(state_value migration_image_id "$RECOVERY_STATE_FILE")" || return 1
              previous_revisions="$(state_value previous_schema_revisions "$RECOVERY_STATE_FILE")" || return 1
              target_revisions="$(state_value target_schema_revisions "$RECOVERY_STATE_FILE")" || return 1
              [[ "$recovery_deployed_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              [[ "$recovery_source_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              [[ "$recovery_image_tag" =~ ^teplo-vpn-rollback/bot:pre-migration-[0-9a-f]{40}$ ]] || return 1
              test "$recovery_image_tag" = "teplo-vpn-rollback/bot:pre-migration-${recovery_deployed_sha}" || return 1
              [[ "$recovery_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              [[ "$migration_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              [[ "$previous_revisions" =~ ^[0-9a-z]+(,[0-9a-z]+)*$ ]] || return 1
              [[ "$target_revisions" =~ ^[0-9a-z]+(,[0-9a-z]+)*$ ]] || return 1
              if [ "$format_version" = '2' ]; then
                old_image_compatible="$(state_value old_image_target_schema_compatible "$RECOVERY_STATE_FILE")" || return 1
                [ "$old_image_compatible" = '0' ] || [ "$old_image_compatible" = '1' ] || return 1
              fi
              [ "$recovery_phase" = 'prepared' ] || [ "$recovery_phase" = 'completed' ] || [ "$recovery_phase" = 'recovered' ] || return 1
              if [ "$recovery_phase" = 'recovered' ] && [ "$format_version" != '2' ]; then
                return 1
              fi
              git cat-file -e "${recovery_source_sha}^{commit}" || return 1
              git cat-file -e "${recovery_deployed_sha}^{commit}" || return 1
              git merge-base --is-ancestor "$recovery_source_sha" "$recovery_deployed_sha" || return 1

              if [ "$recovery_phase" = 'prepared' ]; then
                echo 'Refusing deploy: a prepared migration journal requires protected recovery or completion.' >&2
                return 1
              fi

              if [ "$recovery_phase" = 'recovered' ]; then
                recovery_audit_file="$STATE_DIR/bot-production.migration-recovery.${recovery_deployed_sha}.audit"
                test -r "$recovery_audit_file" || return 1
                if grep -Ev '^(recovered_at|source_sha|image|schema_revisions|from_migration_sha)=[^[:space:]]+$' "$recovery_audit_file" >/dev/null; then
                  echo 'Refusing deploy: malformed recovery audit.' >&2
                  return 1
                fi
                recovered_at="$(state_value recovered_at "$recovery_audit_file")" || return 1
                audit_source_sha="$(state_value source_sha "$recovery_audit_file")" || return 1
                audit_image="$(state_value image "$recovery_audit_file")" || return 1
                audit_schema="$(state_value schema_revisions "$recovery_audit_file")" || return 1
                audit_from_sha="$(state_value from_migration_sha "$recovery_audit_file")" || return 1
                test -n "$recovered_at" || return 1
                test "$audit_source_sha" = "$recovery_source_sha" || return 1
                test "$audit_image" = "$recovery_image_id" || return 1
                test "$audit_schema" = "$VERIFIED_DEPLOY_SCHEMA" || return 1
                test "$audit_from_sha" = "$recovery_deployed_sha" || return 1
                test "$audit_schema" = "$previous_revisions" -o "$audit_schema" = "$target_revisions" || return 1
                if [ "$audit_schema" = "$target_revisions" ] && [ "$old_image_compatible" != '1' ]; then
                  echo 'Refusing deploy: recovered old image lacks target-schema compatibility approval.' >&2
                  return 1
                fi
                test "$VERIFIED_DEPLOY_MODE" = 'recovery' || return 1
                test "$recovery_deployed_sha" = "$VERIFIED_RECOVERY_FROM_SHA" || return 1
                test "$recovery_source_sha" = "$PREVIOUS_SHA" || return 1
                test "$recovery_image_id" = "$VERIFIED_DEPLOY_IMAGE" || return 1
                git merge-base --is-ancestor "$PREVIOUS_SHA" "$TARGET_SHA" || return 1
                return
              fi

              # A normal live state can follow a completed migration.
              # The journal target must be in the current source ancestry and
              # its target schema must still be the live schema. This accepts
              # the valid historical v1 production journal after later
              # application-only deploys, while rejecting a contradictory
              # synthetic `completed` marker.
              test "$VERIFIED_DEPLOY_MODE" = 'normal' || return 1
              test "$VERIFIED_DEPLOY_SCHEMA" = "$target_revisions" || return 1
              git merge-base --is-ancestor "$recovery_deployed_sha" "$PREVIOUS_SHA" || return 1
              git merge-base --is-ancestor "$PREVIOUS_SHA" "$TARGET_SHA" || return 1
              if [ "$PREVIOUS_SHA" = "$recovery_deployed_sha" ]; then
                test "$VERIFIED_DEPLOY_IMAGE" = "$migration_image_id" || return 1
              fi
            }

            write_deployed_state() {
              install -d -m 700 "$STATE_DIR"
              state_tmp="$(mktemp "$STATE_DIR/bot-production.XXXXXX")"
              printf 'sha=%s\nimage=%s\n' "$TARGET_SHA" "$(docker inspect --format '{{.Image}}' remnawave_bot)" > "$state_tmp"
              chmod 600 "$state_tmp"
              mv "$state_tmp" "$STATE_FILE"
            }

            trap cleanup_build_context EXIT

            # The image is built from this directory. Ignored runtime data (.env, data, uploads,
            # logs) stays outside the build context; every non-ignored file must be in Git.
            if [ -n "$(git status --porcelain)" ]; then
              echo 'Refusing deploy: the server working tree is not an exact tracked source tree.' >&2
              exit 10
            fi

            if find . -maxdepth 1 -type f \( -name '*override*.yml' -o -name '*override*.yaml' \) -print -quit | grep -q .; then
              echo 'Refusing deploy: a Compose override file is present on the server.' >&2
              exit 11
            fi

            if [ "$(df -Pk . | awk 'NR == 2 { print $4 }')" -lt "$MIN_FREE_KB" ]; then
              echo 'Refusing deploy: less than 2 GiB of free disk space for a safe build/rollback.' >&2
              exit 12
            fi

            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            readonly PREVIOUS_SHA="$(git rev-parse HEAD)"
            readonly REMOTE_MAIN_SHA="$(git rev-parse origin/main)"

            # Do not let a queued older workflow deploy over a newer main.
            if [ "$TARGET_SHA" != "$REMOTE_MAIN_SHA" ]; then
              echo "Skipping superseded deploy: workflow=$TARGET_SHA, origin/main=$REMOTE_MAIN_SHA"
              exit 0
            fi

            git cat-file -e "${TARGET_SHA}^{commit}"

            # A normal deploy may begin only from the source/image recorded as
            # the stable production state and with no unresolved migration.
            # This closes the cross-workflow hard-kill window after a protected
            # migration wrote `prepared` and checked out its target.
            verify_deployed_state "$PREVIOUS_SHA"
            verify_no_unresolved_migration

            if [ "$PREVIOUS_SHA" = "$TARGET_SHA" ]; then
              echo "Source already at $TARGET_SHA; requiring the container health gate again."
              compose up -d --no-build --wait --wait-timeout 240 "$SERVICE"
              compose ps "$SERVICE"
              exit 0
            fi

            # A divergent history requires an explicit investigation, never an implicit checkout.
            if ! git merge-base --is-ancestor "$PREVIOUS_SHA" "$TARGET_SHA"; then
              echo "Refusing deploy: server commit $PREVIOUS_SHA is not an ancestor of $TARGET_SHA." >&2
              exit 13
            fi

            # main.py runs Alembic during normal startup. A new migration needs the dedicated,
            # manual migration workflow after backup + restore/upgrade evidence and owner approval.
            if ! git diff --quiet "$PREVIOUS_SHA" "$TARGET_SHA" -- migrations alembic.ini app/database main.py app/config.py; then
              echo 'Refusing automatic deploy: a database or migration-risk change is present.' >&2
              echo 'Use "Deploy bot migration to production" only after the documented migration gates.' >&2
              exit 14
            fi

            # Docker/Compose changes can change build inputs, dependencies, ports or volumes.
            if ! git diff --quiet "$PREVIOUS_SHA" "$TARGET_SHA" -- Dockerfile .dockerignore docker-compose.yml; then
              echo 'Refusing automatic deploy: a Docker or Compose change is present.' >&2
              echo 'Use "Deploy bot infrastructure to production" after the controlled-change gates.' >&2
              exit 15
            fi

            # Workflow and release-control changes alter the production control
            # plane even when the application image itself is unchanged. They
            # require the protected infrastructure workflow and owner approval.
            if ! git diff --quiet "$PREVIOUS_SHA" "$TARGET_SHA" -- .github; then
              echo 'Refusing automatic deploy: a production control-plane change is present.' >&2
              echo 'Use "Deploy bot infrastructure to production" after the controlled-change gates.' >&2
              exit 16
            fi

            readonly PREVIOUS_IMAGE_ID="$(docker inspect --format '{{.Image}}' remnawave_bot)"
            readonly SERVICE_IMAGE="$(docker inspect --format '{{.Config.Image}}' remnawave_bot)"
            readonly ROLLBACK_IMAGE_TAG='teplo-vpn-rollback/bot:previous'
            docker image tag "$PREVIOUS_IMAGE_ID" "$ROLLBACK_IMAGE_TAG"

            SOURCE_SWITCHED=0
            SERVICE_SWITCH_ATTEMPTED=0
            rollback() {
              rc=$?
              trap - ERR
              set +e
              if [ "$SOURCE_SWITCHED" = '1' ]; then
                echo "Deploy failed; restoring the server source revision $PREVIOUS_SHA." >&2
                git checkout --detach "$PREVIOUS_SHA"
              fi
              if [ "$SERVICE_SWITCH_ATTEMPTED" = '1' ]; then
                echo 'The new container may have started; restoring the preserved working image.' >&2
                docker image tag "$ROLLBACK_IMAGE_TAG" "$SERVICE_IMAGE"
                compose up -d --no-build --wait --wait-timeout 240 "$SERVICE"
                compose ps "$SERVICE"
              fi
              exit "$rc"
            }
            trap rollback ERR

            git checkout --detach "$TARGET_SHA"
            SOURCE_SWITCHED=1
            create_clean_build_context
            compose build "$SERVICE"
            # --wait makes a green workflow mean that Docker confirmed the real HTTP healthcheck.
            SERVICE_SWITCH_ATTEMPTED=1
            compose up -d --wait --wait-timeout 240 "$SERVICE"
            compose ps "$SERVICE"
            write_deployed_state

            SOURCE_SWITCHED=0
            SERVICE_SWITCH_ATTEMPTED=0
            trap - ERR
            echo "Container healthy for $TARGET_SHA at $(date --iso-8601=seconds)"
